<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant de Stage Physiothérapie - Mode Guidé</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --deep-teal: #0a4d4e; --warm-teal: #1a6b6d; --gold: #d4a373;
            --cream: #f9f6f2; --off-white: #ffffff; --charcoal: #2a2a2a;
            --mid-gray: #6a6a6a; --light-border: #e8e4df; --success: #5a8f7b;
            --error: #c1666b; --shadow: rgba(10, 77, 78, 0.15);
        }
        body { font-family: 'Crimson Pro', serif; background: var(--cream); color: var(--charcoal); line-height: 1.7; }
        .header { background: linear-gradient(135deg, var(--deep-teal), var(--warm-teal)); color: var(--off-white); padding: 2rem; }
        h1 { font-size: 2.5rem; font-weight: 600; font-style: italic; margin-bottom: 0.5rem; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 2rem; }
        .question-card { background: var(--off-white); border-radius: 16px; padding: 3rem; box-shadow: 0 8px 32px var(--shadow); margin-bottom: 2rem; }
        .question-text { font-size: 1.8rem; color: var(--deep-teal); margin-bottom: 2rem; font-weight: 600; }
        .progress-bar { background: var(--cream); border-radius: 8px; padding: 1rem; margin-bottom: 2rem; }
        .progress-fill { background: linear-gradient(90deg, var(--deep-teal), var(--warm-teal)); height: 8px; border-radius: 4px; transition: width 0.3s; }
        .button-group { display: flex; gap: 1rem; margin: 1.5rem 0; }
        .btn-choice { flex: 1; padding: 1.25rem; border-radius: 12px; border: 2px solid var(--light-border); background: var(--cream); font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-choice:hover { border-color: var(--warm-teal); transform: translateY(-2px); }
        .btn-choice.selected { background: var(--deep-teal); color: var(--off-white); border-color: var(--deep-teal); }
        .text-input { width: 100%; padding: 1rem; border: 2px solid var(--light-border); border-radius: 8px; font-size: 1.1rem; }
        .text-input-large { width: 100%; min-height: 150px; padding: 1.5rem; border: 2px solid var(--light-border); border-radius: 12px; font-size: 1.1rem; resize: vertical; }
        .mic-button { width: 100%; padding: 1.25rem; margin-top: 1rem; border-radius: 12px; border: 2px solid var(--gold); background: var(--off-white); font-weight: 700; cursor: pointer; }
        .mic-button.recording { background: var(--error); color: var(--off-white); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .btn { padding: 1rem 2rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-primary { background: linear-gradient(135deg, var(--deep-teal), var(--warm-teal)); color: var(--off-white); }
        .btn-secondary { background: var(--off-white); color: var(--deep-teal); border: 2px solid var(--deep-teal); }
        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .alert-success { background: rgba(90, 143, 123, 0.1); color: var(--success); }
        .alert-error { background: rgba(193, 102, 107, 0.1); color: var(--error); }
        .loading { text-align: center; padding: 3rem; }
        .spinner { border: 3px solid var(--light-border); border-top: 3px solid var(--deep-teal); border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://tigetqkvpkyitpdhjjlq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpZ2V0cWt2cGt5aXRwZGhqamxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNzcxNzMsImV4cCI6MjA5Mzg1MzE3M30.WfZkWyDMLSPnZGe4ZKxhnhW4jSIn6YHikDBKaFpFMcw';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const QUESTIONS_CAS = [
            { type: 'text', q: 'Diagnostic ou raison de consultation?', field: 'diagnostic' },
            { type: 'text', q: 'Âge du patient?', field: 'age' },
            { type: 'yesno', q: 'Avez-vous observé?', field: 'evaluation_o' },
            { type: 'choice', q: 'Évaluation avec moniteur?', field: 'evaluation_em', choices: ['Aucune', 'Initiale', 'Réévaluation', 'Congé', 'Plusieurs'] },
            { type: 'choice', q: 'Évaluation seul?', field: 'evaluation_es', choices: ['Aucune', 'Initiale', 'Réévaluation', 'Congé', 'Plusieurs'] },
            { type: 'yesno', q: 'Traitement avec moniteur?', field: 'traitement_tm' },
            { type: 'yesno', q: 'Traitement seul?', field: 'traitement_ts' },
            { type: 'yesno', q: 'Conditions cardio-respiratoires?', field: 'conditions_cr' },
            { type: 'longtext', q: 'Racontez TOUT ce que vous avez fait avec ce patient', field: 'details', hint: 'Détaillez toutes les évaluations et traitements...' }
        ];

        const QUESTIONS_JOURNAL = [
            { type: 'longtext', q: 'Résumez ce que vous avez fait aujourd\'hui', field: 'activite' },
            { type: 'longtext', q: 'Qu\'avez-vous appris?', field: 'appris' },
            { type: 'longtext', q: 'Difficultés rencontrées?', field: 'difficultes' },
            { type: 'longtext', q: 'Vers quoi orientez-vous vos apprentissages?', field: 'orientation' },
            { type: 'longtext', q: 'Réflexions ou questions?', field: 'reflexions' }
        ];

        function GuidedQuestionnaire({ user, onComplete }) {
            const [step, setStep] = useState('intro');
            const [nbCas, setNbCas] = useState(0);
            const [currentCas, setCurrentCas] = useState(0);
            const [currentQ, setCurrentQ] = useState(0);
            const [casData, setCasData] = useState([]);
            const [currentAnswers, setCurrentAnswers] = useState({});
            const [journalData, setJournalData] = useState({});
            const [isRecording, setIsRecording] = useState(false);
            const [tempText, setTempText] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);
            const [alert, setAlert] = useState(null);
            const recognitionRef = useRef(null);

            useEffect(() => {
                if ('webkitSpeechRecognition' in window) {
                    const SpeechRecognition = window.webkitSpeechRecognition;
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.lang = 'fr-FR';
                    recognitionRef.current.onresult = (e) => {
                        const text = e.results[0][0].transcript;
                        setTempText(text);
                    };
                    recognitionRef.current.onend = () => setIsRecording(false);
                }
            }, []);

            const startRecording = () => {
                if (recognitionRef.current) {
                    setTempText('');
                    recognitionRef.current.start();
                    setIsRecording(true);
                }
            };

            const showAlert = (msg, type) => {
                setAlert({ msg, type });
                setTimeout(() => setAlert(null), 3000);
            };

            const handleIntro = () => {
                if (nbCas > 0 && nbCas <= 10) {
                    setCasData(Array(nbCas).fill(null).map(() => ({})));
                    setStep('cas');
                    setCurrentCas(0);
                    setCurrentQ(0);
                } else {
                    showAlert('Entrez un nombre entre 1 et 10', 'error');
                }
            };

            const handleAnswer = (value) => {
                setCurrentAnswers({...currentAnswers, [QUESTIONS_CAS[currentQ].field]: value});
                if (currentQ < QUESTIONS_CAS.length - 1) {
                    setCurrentQ(currentQ + 1);
                } else {
                    const newCasData = [...casData];
                    newCasData[currentCas] = {...currentAnswers, [QUESTIONS_CAS[currentQ].field]: value};
                    setCasData(newCasData);
                    if (currentCas < nbCas - 1) {
                        setCurrentCas(currentCas + 1);
                        setCurrentQ(0);
                        setCurrentAnswers({});
                    } else {
                        setStep('journal');
                        setCurrentQ(0);
                    }
                }
            };

            const handleJournalAnswer = (value) => {
                setJournalData({...journalData, [QUESTIONS_JOURNAL[currentQ].field]: value});
                if (currentQ < QUESTIONS_JOURNAL.length - 1) {
                    setCurrentQ(currentQ + 1);
                } else {
                    analyzeAll();
                }
            };

            const analyzeAll = async () => {
                setIsProcessing(true);
                try {
                    const transcript = `
CAS CLINIQUES:
${casData.map((c, i) => `Cas ${i+1}: ${JSON.stringify(c)}`).join('\n')}

JOURNAL:
${JSON.stringify(journalData)}
                    `;

                    const apiUrl = '/.netlify/functions/analyze';
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ transcript })
                    });

                    if (!response.ok) throw new Error('Erreur analyse');
                    const result = await response.json();
                    let text = result.content[0].text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                    const analysis = JSON.parse(text);

                    // Sauvegarder
                    if (analysis.journal && analysis.journal.length > 0) {
                        await supabase.from('journal_reflexif').insert(analysis.journal.map(j => ({ user_id: user.id, ...j })));
                    }
                    if (analysis.cas && analysis.cas.length > 0) {
                        await supabase.from('cas_cliniques').insert(analysis.cas.map(c => ({ user_id: user.id, stage: 1, ...c })));
                    }

                    showAlert('✅ Analyse terminée! Données sauvegardées.', 'success');
                    setTimeout(() => onComplete(), 2000);
                } catch (error) {
                    console.error(error);
                    showAlert('Erreur: ' + error.message, 'error');
                }
                setIsProcessing(false);
            };

            if (isProcessing) {
                return (
                    <div className="loading">
                        <div className="spinner"></div>
                        <p>Claude analyse vos réponses...</p>
                    </div>
                );
            }

            if (step === 'intro') {
                return (
                    <div className="container">
                        {alert && <div className={`alert alert-${alert.type}`}>{alert.msg}</div>}
                        <div className="question-card">
                            <h2 className="question-text">Combien de patients avez-vous vus aujourd'hui?</h2>
                            <input 
                                type="number" 
                                className="text-input" 
                                value={nbCas} 
                                onChange={(e) => setNbCas(parseInt(e.target.value) || 0)}
                                min="1"
                                max="10"
                                placeholder="Ex: 2"
                            />
                            <div style={{ marginTop: '2rem' }}>
                                <button className="btn btn-primary" onClick={handleIntro}>
                                    Suivant →
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'cas') {
                const q = QUESTIONS_CAS[currentQ];
                const totalQ = nbCas * QUESTIONS_CAS.length;
                const currentGlobalQ = currentCas * QUESTIONS_CAS.length + currentQ + 1;
                const progress = (currentGlobalQ / totalQ) * 100;

                return (
                    <div className="container">
                        {alert && <div className={`alert alert-${alert.type}`}>{alert.msg}</div>}
                        <div className="progress-bar">
                            <div>Cas {currentCas + 1}/{nbCas} - Question {currentQ + 1}/{QUESTIONS_CAS.length}</div>
                            <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="question-card">
                            <h2 className="question-text">{q.q}</h2>
                            
                            {q.type === 'yesno' && (
                                <div className="button-group">
                                    <button className="btn-choice" onClick={() => handleAnswer(true)}>✓ Oui</button>
                                    <button className="btn-choice" onClick={() => handleAnswer(false)}>✗ Non</button>
                                </div>
                            )}

                            {q.type === 'choice' && (
                                <div style={{ display: 'grid', gap: '1rem' }}>
                                    {q.choices.map(c => (
                                        <button key={c} className="btn-choice" onClick={() => handleAnswer(c)}>{c}</button>
                                    ))}
                                </div>
                            )}

                            {q.type === 'text' && (
                                <>
                                    <input 
                                        type="text" 
                                        className="text-input"
                                        value={tempText}
                                        onChange={(e) => setTempText(e.target.value)}
                                        placeholder={q.hint || ''}
                                    />
                                    <button 
                                        className={`mic-button ${isRecording ? 'recording' : ''}`}
                                        onClick={isRecording ? () => {} : startRecording}
                                    >
                                        {isRecording ? '🎤 Enregistrement...' : '🎤 Parler'}
                                    </button>
                                    <div style={{ marginTop: '1rem' }}>
                                        <button className="btn btn-primary" onClick={() => handleAnswer(tempText)}>
                                            Suivant →
                                        </button>
                                    </div>
                                </>
                            )}

                            {q.type === 'longtext' && (
                                <>
                                    <textarea 
                                        className="text-input-large"
                                        value={tempText}
                                        onChange={(e) => setTempText(e.target.value)}
                                        placeholder={q.hint || ''}
                                    />
                                    <button 
                                        className={`mic-button ${isRecording ? 'recording' : ''}`}
                                        onClick={isRecording ? () => {} : startRecording}
                                    >
                                        {isRecording ? '🎤 Enregistrement...' : '🎤 Enregistrer la réponse'}
                                    </button>
                                    <div style={{ marginTop: '1rem' }}>
                                        <button className="btn btn-primary" onClick={() => handleAnswer(tempText)}>
                                            Suivant →
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                );
            }

            if (step === 'journal') {
                const q = QUESTIONS_JOURNAL[currentQ];
                const progress = ((currentQ + 1) / QUESTIONS_JOURNAL.length) * 100;

                return (
                    <div className="container">
                        {alert && <div className={`alert alert-${alert.type}`}>{alert.msg}</div>}
                        <div className="progress-bar">
                            <div>Journal Réflexif - Question {currentQ + 1}/{QUESTIONS_JOURNAL.length}</div>
                            <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="question-card">
                            <h2 className="question-text">{q.q}</h2>
                            <textarea 
                                className="text-input-large"
                                value={tempText}
                                onChange={(e) => setTempText(e.target.value)}
                            />
                            <button 
                                className={`mic-button ${isRecording ? 'recording' : ''}`}
                                onClick={isRecording ? () => {} : startRecording}
                            >
                                {isRecording ? '🎤 Enregistrement...' : '🎤 Enregistrer la réponse'}
                            </button>
                            <div style={{ marginTop: '1rem' }}>
                                <button className="btn btn-primary" onClick={() => handleJournalAnswer(tempText)}>
                                    {currentQ < QUESTIONS_JOURNAL.length - 1 ? 'Suivant →' : '🤖 Analyser tout'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        function App() {
            const [session, setSession] = useState(null);
            const [mode, setMode] = useState('choose');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_, session) => setSession(session));
                return () => subscription.unsubscribe();
            }, []);

            if (!session) {
                return (
                    <div>
                        <div className="header"><h1>Assistant de Stage Physio</h1></div>
                        <div className="container">
                            <div className="question-card">
                                <p>Veuillez vous connecter pour utiliser l'application.</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (mode === 'choose') {
                return (
                    <div>
                        <div className="header"><h1>Mode de Saisie</h1></div>
                        <div className="container">
                            <div className="question-card">
                                <h2 className="question-text">Comment voulez-vous saisir votre journée?</h2>
                                <div className="button-group">
                                    <button className="btn-choice" onClick={() => setMode('guided')}>
                                        ✍️ Mode Guidé<br/><small>Questions une par une</small>
                                    </button>
                                    <button className="btn-choice" onClick={() => setMode('free')}>
                                        📝 Mode Libre<br/><small>Texte complet</small>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (mode === 'guided') {
                return (
                    <div>
                        <div className="header"><h1>Saisie Guidée</h1></div>
                        <GuidedQuestionnaire user={session.user} onComplete={() => setMode('choose')} />
                    </div>
                );
            }

            return <div><div className="header"><h1>Mode Libre</h1></div></div>;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
